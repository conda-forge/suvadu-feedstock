context:
  version: "0.5.0"

package:
  name: suvadu
  version: ${{ version }}

source:
  url: https://github.com/AppachiTech/suvadu/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 20b8d280e7f7efdb5d0718603c3096f4b320106efb6ae2309279e0fdac45385f

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml
      # generate shell completions and manpage
      - if: build_platform == host_platform
        then:
          - ^suv completions bash | save --force ($prefix)/share/bash-completion/completions/suv
          - ^suv completions fish | save --force ($prefix)/share/fish/vendor_completions.d/suv.fish
          - ^suv completions zsh  | save --force ($prefix)/share/zsh/site-functions/_suv
          - ^suv man              | save --force ($prefix)/share/man/man1/suv.1
  # starting with v0.4.2, Suvadu introduced Unix-specific terminal redirection logic using `std::os::unix::*` and POSIX system calls from the `libc` crate
  # without a Windows fallback or even conditional compilation guards, so only Unix is supported anymore
  skip: not unix

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - nushell

tests:
  - script:
      - suv help
      - suv version
  - package_contents:
      bin:
        - suv
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/man/man1/suv.1
            - share/bash-completion/completions/suv
            - share/fish/vendor_completions.d/suv.fish
            - share/zsh/site-functions/_suv
        - if: win and build_platform == host_platform
          then:
            - Library/share/man/man1/suv.1
            - Library/share/bash-completion/completions/suv
            - Library/share/fish/vendor_completions.d/suv.fish
            - Library/share/zsh/site-functions/_suv
      strict: true

about:
  summary: Total recall for your terminal. A database-backed shell history with fuzzy search.
  description: |
    Suvadu replaces your shell history with a SQLite-backed store. Every command gets
    structured context — exit code, duration, directory, executor, session. AI agents
    can query it via MCP. 100% local. Features include <2ms recording overhead,
    <10ms search across 1M+ entries, AI agent tracking, an interactive TUI, and an
    MCP server providing history context and tools including risk assessment.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://suvadu.sh
  documentation: https://suvadu.sh/cli
  repository: https://github.com/AppachiTech/suvadu

extra:
  recipe-maintainers:
    - salim-b
